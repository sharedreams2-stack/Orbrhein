name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'Oberjein-android-project.zip'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f Oberjein-android-project.zip || {
            echo "::error::Oberjein-android-project.zip is missing from the repository root."
            exit 1
          }
          unzip -q Oberjein-android-project.zip -d extracted
          test -f extracted/Oberjein/app/build.gradle.kts || {
            echo "::error::Expected project at extracted/Oberjein."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The hosted runner already contains Android command-line tools.
      # setup-android may fail while requesting the obsolete "tools" package,
      # so keep its environment setup but do not let that obsolete package stop the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          command -v sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/Oberjein
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Oberjein-debug-apk
          path: extracted/Oberjein/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
