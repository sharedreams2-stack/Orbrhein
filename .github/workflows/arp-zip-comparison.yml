name: Build ZIP project for comparison

on:
  push:
    branches:
      - compare/arp-zip-full-build
    paths:
      - 'Oberjein-android-project-arp (1).zip'
      - '.github/workflows/arp-zip-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-zip-project:
    name: Build complete Android project from ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v4

      - name: Extract ZIP into an isolated directory
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Oberjein-android-project-arp (1).zip"
          test -f "$ZIP_FILE" || {
            echo "::error::Expected ZIP not found: $ZIP_FILE"
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          }
          mkdir -p comparison-source
          unzip -q "$ZIP_FILE" -d comparison-source
          PROJECT_DIR="comparison-source/Oberjein"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP project extracted to $PROJECT_DIR"
          find "$PROJECT_DIR/app/src/main" -maxdepth 3 -type f | sort | head -100

      - name: Apply Android MIDI compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          MIDI_FILE="$PROJECT_DIR/app/src/main/java/com/oberjein/synth/MidiIo.kt"
          # PROPERTY_SERVICE_INFO is not exposed by the compile SDK used by this project.
          # The Android MIDI service stores this parcelable under the stable "service_info" key.
          sed -i 's/MidiDeviceInfo\.PROPERTY_SERVICE_INFO/"service_info"/' "$MIDI_FILE"
          grep -n 'getParcelable<ServiceInfo>' "$MIDI_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || {
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f
            exit 1
          }
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile ZIP project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload comparison APK
        uses: actions/upload-artifact@v4
        with:
          name: Oberjein-ZIP-comparison-debug-apk
          path: comparison-source/Oberjein/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oberjein-ZIP-build-diagnostics
          path: |
            comparison-source/Oberjein/app/build/reports/**
            comparison-source/Oberjein/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
