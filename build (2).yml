name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ZIP_FILE: Oberjein-android-project.zip   # zip na raiz do repositório
  PROJECT_DIR: Oberjein                    # pasta que existe dentro do zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Extrair o projeto
        run: unzip -q "$ZIP_FILE" -d extracted

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK e CMake
        run: sdkmanager "cmake;3.22.1" "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar o Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar o APK de debug
        working-directory: extracted/${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Oberjein-debug-apk
          path: extracted/${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
